name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Markdown Links and Fences
        run: |
          python - << 'EOF'
          import glob, os, re, sys

          errors = []
          md_files = sorted(glob.glob("*.md") + glob.glob("references/*.md"))
          print(f"Checking {len(md_files)} markdown files...")

          link_re = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')

          for path in md_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Check code fences
              fence_count = sum(1 for line in content.splitlines() if line.strip().startswith("```"))
              if fence_count % 2 != 0:
                  errors.append(f"{path}: Unbalanced code fences ({fence_count})")

              # Check links
              for text, target in link_re.findall(content):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  clean_target = target.split("#")[0]
                  if clean_target:
                      resolved = os.path.normpath(os.path.join(os.path.dirname(path), clean_target))
                      if not os.path.exists(resolved):
                          errors.append(f"{path}: Broken internal link [{text}]({target}) -> {resolved}")

          if errors:
              print("\nValidation failed with errors:")
              for err in errors:
                  print(f"  ❌ {err}")
              sys.exit(1)

          print("\nAll Markdown files and links validated successfully! ✨")
          EOF
